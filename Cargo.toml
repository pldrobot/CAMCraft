[package]
name = "camcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
dxf = "0.6.2"
eframe = "0.37.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
truck-geometry = "0.5.0"
truck-meshalgo = "0.4"
truck-polymesh = "0.6.0"
truck-stepio = "0.3"
truck-topology = "0.6.0"

[profile.dev]
opt-level = 2

[lib]
name = "camcraft"
path = "src/lib.rs"

[[bin]]
name = "camcraft"
path = "src/main.rs"
